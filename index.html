<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Login — BCh Mentorship</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0b1622;--ink2:#1a2e45;--sky:#1a6fa8;--sky2:#155886;--gold:#c9a227;--fog:#f2f6fb;--fog3:#dde5f0;--white:#fff;--text:#0b1622;--text2:#3a5068;--text3:#7a93ab;--red:#e05454;--green:#1a9e6e;--r2:10px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--fog);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{min-height:100dvh;display:flex;align-items:stretch}
.left{width:45%;background:linear-gradient(160deg,var(--ink) 0%,var(--ink2) 100%);display:flex;flex-direction:column;justify-content:center;padding:3rem;position:relative;overflow:hidden}
.left::before{content:'';position:absolute;top:-80px;right:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(26,111,168,.22),transparent 70%)}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:3rem;text-decoration:none}
.logo-mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--sky),var(--sky2));display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:#fff;box-shadow:0 3px 16px rgba(26,111,168,.4)}
.logo-name{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;color:#fff}
.logo-name span{color:var(--gold)}
.left h2{font-family:'Cormorant Garamond',serif;font-size:2rem;font-style:italic;font-weight:700;color:#fff;margin-bottom:1rem;line-height:1.2}
.unis{display:flex;flex-direction:column;gap:.6rem;margin-top:1.5rem}
.uni-row{display:flex;align-items:center;gap:.9rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.75rem 1rem}
.uni-badge{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:#fff;flex-shrink:0}
.uni-nm{font-weight:600;font-size:.85rem;color:#fff}
.uni-loc{font-size:.7rem;color:rgba(255,255,255,.4)}
.right{flex:1;display:flex;align-items:center;justify-content:center;padding:2.5rem;overflow-y:auto}
.form-box{width:100%;max-width:420px}
.form-top{margin-bottom:1.8rem}
.form-top h2{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:700;color:var(--text);margin-bottom:.4rem}
.form-top p{font-size:.82rem;color:var(--text3)}
.form-top p a{color:var(--sky);font-weight:600;text-decoration:none}
.fg{margin-bottom:1rem}
.fg label{display:block;font-weight:600;font-size:.74rem;color:var(--text2);margin-bottom:.38rem;text-transform:uppercase;letter-spacing:.04em}
.fg input{width:100%;padding:.8rem 1rem;border:1.5px solid var(--fog3);border-radius:var(--r2);font-family:'DM Sans',sans-serif;font-size:.9rem;background:var(--fog);color:var(--text);outline:none;transition:border-color .2s}
.fg input:focus{border-color:var(--sky);background:var(--white);box-shadow:0 0 0 3px rgba(26,111,168,.08)}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--text3);cursor:pointer}
.chk input{accent-color:var(--sky);width:15px;height:15px}
.forgot{font-size:.82rem;color:var(--sky);font-weight:600;text-decoration:none;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.88rem;border-radius:var(--r2);font-family:'DM Sans',sans-serif;font-weight:700;font-size:.92rem;cursor:pointer;transition:all .2s;border:none}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:#fff;box-shadow:0 3px 14px rgba(11,22,34,.18)}
.btn-ink:hover{background:var(--ink2)}
.divider{display:flex;align-items:center;gap:1rem;margin:1.4rem 0}
.divider hr{flex:1;border:none;border-top:1px solid var(--fog3)}
.divider span{font-size:.76rem;color:var(--text3)}
.admin-btn{display:block;text-align:center;padding:.82rem;border:1.5px solid var(--fog3);border-radius:var(--r2);color:var(--text3);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none}
.admin-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,162,39,.04)}
.alert{padding:.75rem 1rem;border-radius:var(--r2);font-size:.8rem;font-weight:500;margin-bottom:1rem;display:none;line-height:1.5}
.alert.err{background:#fff1f1;border:1px solid rgba(224,84,84,.2);color:var(--red);display:block}
.alert.ok{background:#f0faf5;border:1px solid rgba(26,158,110,.25);color:var(--green);display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.left{display:none}.right{padding:1.8rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <a href="#" class="logo"><div class="logo-mark">B</div><div class="logo-name">BCh <span>Mentorship</span></div></a>
    <h2>Welcome Back, Scholar!</h2>
    <div class="unis" id="uniList">
      <div class="uni-row"><div class="uni-badge" style="background:var(--sky)">CBU</div><div><div class="uni-nm">Copperbelt University</div><div class="uni-loc">Kitwe</div></div></div>
      <div class="uni-row"><div class="uni-badge" style="background:var(--gold)">MU</div><div><div class="uni-nm">Mulungushi University</div><div class="uni-loc">Kabwe</div></div></div>
      <div class="uni-row"><div class="uni-badge" style="background:#2d6a8f">MUK</div><div><div class="uni-nm">Mukuba University</div><div class="uni-loc">Itimpi</div></div></div>
      <div class="uni-row"><div class="uni-badge" style="background:#7c3f3f">UNZA</div><div><div class="uni-nm">University of Zambia</div><div class="uni-loc">Lusaka</div></div></div>
    </div>
  </div>
  <div class="right">
    <div class="form-box">
      <div class="form-top"><h2>Log In</h2><p>New to BCh Mentorship? <a href="signup.html">Create an account</a></p></div>
      <div class="alert" id="alertBox"></div>
      <div class="fg"><label>Email Address</label><input type="email" id="loginEmail" placeholder="you@email.com"/></div>
      <div class="fg"><label>Password</label><input type="password" id="loginPw" placeholder="Your password"/></div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="rememberMe"/> Remember me</label>
        <a class="forgot" onclick="doForgot()">Forgot password?</a>
      </div>
      <button class="btn btn-ink" id="loginBtn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Log In</button>
      <div class="divider"><hr/><span>or</span><hr/></div>
      <a href="admin.html" class="admin-btn">🔐 Admin Panel Access</a>
    </div>
  </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC1YH0tA8mO3qujnps8p5UbgMix91tO5-U",authDomain:"biochemistry-b4b77.firebaseapp.com",projectId:"biochemistry-b4b77",storageBucket:"biochemistry-b4b77.appspot.com",messagingSenderId:"886538300649",appId:"1:886538300649:web:d2bfde3c4e141a95085478",measurementId:"G-GTYWCZTJMW"};
const fapp=initializeApp(cfg),auth=getAuth(fapp),db=getFirestore(fapp);
const $=id=>document.getElementById(id);
function alert_(msg,type='err'){const b=$('alertBox');b.textContent=msg;b.className='alert '+type}

window.doLogin=async function(){
  const em=$('loginEmail').value.trim(),pw=$('loginPw').value;
  if(!em||!pw){alert_('Please enter your email and password');return;}
  const btn=$('loginBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Logging in…';
  try{
    const cred=await signInWithEmailAndPassword(auth,em,pw);
    // Check admin first
    const adminDoc=await getDoc(doc(db,'admins',cred.user.uid));
    if(adminDoc.exists()){alert_('Welcome Admin! Redirecting…','ok');setTimeout(()=>location.href='admin.html',700);return;}
    // Check user status
    const userDoc=await getDoc(doc(db,'users',cred.user.uid));
    if(userDoc.exists()){
      const data=userDoc.data();
      if(data.canLogin===false||data.status==='banned'){
        await auth.signOut();
        alert_('Your account has been suspended. Contact your administrator.');
        btn.disabled=false;btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Log In';
        return;
      }
    }
    alert_('Login successful! Redirecting…','ok');
    setTimeout(()=>location.href='dashboard.html',700);
  }catch(e){
    let msg='Login failed. Please try again.';
    if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential')msg='No account found with this email.';
    if(e.code==='auth/wrong-password')msg='Incorrect password.';
    if(e.code==='auth/too-many-requests')msg='Too many attempts. Please wait and try again.';
    alert_(msg);
    btn.disabled=false;btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Log In';
  }
};
window.doForgot=async function(){
  const em=$('loginEmail').value.trim();
  if(!em){alert_('Enter your email address above first');return;}
  try{await sendPasswordResetEmail(auth,em);alert_('Password reset email sent! Check your inbox.','ok');}
  catch{alert_('Could not send reset email. Check the address.');}
};
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
